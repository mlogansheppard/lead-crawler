services:
  lead-crawler:
    build: .
    container_name: lead-crawler
    restart: unless-stopped
    ports:
      # only reachable from this server (n8n container uses http://172.17.0.1:8088)
      - "172.17.0.1:8088:8088"
    environment:
      - API_KEY=${API_KEY}
      - DFS_LOGIN=${DFS_LOGIN}
      - DFS_PASSWORD=${DFS_PASSWORD}
      - CONCURRENCY=100
      - PAGE_TIMEOUT=12
      - SITE_BUDGET=45
      - DATA_DIR=/data
      - RESUME_EVERY_SECONDS=600
      # extra jobs wait in a queue; raise on a bigger VPS
      - MAX_ACTIVE_JOBS=2
      # third pass that re-fetches sites that refused us as real Chrome; set BLOCKED_RETRY=1 in .env to turn on
      - BLOCKED_RETRY=${BLOCKED_RETRY:-0}
    volumes:
      # saved job progress, so a paused or restarted job picks up where it left off
      - ./data:/data
    # public resolvers: Docker's built-in DNS can't keep up with 100+ new websites a second
    dns:
      - 1.1.1.1
      - 8.8.8.8
      - 9.9.9.9
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    # hard memory cap so the crawler can never starve n8n (VPS has 7.8 GB, n8n uses ~1 GB); if it is ever hit,
    # the container restarts and the job carries on from its saved progress. Swap is kept small on purpose:
    # a crawler living in swap crawls ~13 sites/min instead of ~500
    mem_limit: 3500m
    memswap_limit: 4000m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8088/health')"]
      interval: 60s
      timeout: 5s
      retries: 3
